<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Usta paneli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f0e7">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 860px }
.auth { max-width: 400px; margin: 9vh auto 0; display: grid; gap: 18px }
.auth h1 { font-size: 2.6rem }
.mark { width: 44px; height: 44px; border-radius: 12px; background: var(--band); display: grid; place-items: center }
header.top { display: flex; align-items: center; gap: 12px; padding-block: 16px 10px; border-bottom: 1px solid var(--hair) }
header.top .shop { margin-right: auto; min-width: 0 }
header.top .shop b { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; display: block; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.me { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; font-weight: 600; font-size: .9rem }
.me:hover { background: var(--card) }
.me .av { width: 28px; height: 28px; border-radius: 50%; background: var(--band); color: var(--on-band); display: grid; place-items: center; font-size: .78rem; font-weight: 700 }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; gap: 4px; background: var(--paper); border-top: 1px solid var(--hair); padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) }
nav.tabs button { flex: 1; max-width: 150px; display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; font-size: .78rem; font-weight: 600; color: var(--soft) }
nav.tabs button svg { width: 22px; height: 22px }
nav.tabs button[aria-current="page"] { color: var(--ink); background: var(--card) }
@media (min-width: 900px) { nav.tabs { position: static; justify-content: flex-start; border: 0; padding: 12px 0 0; background: none } nav.tabs button { flex: none; grid-auto-flow: column; gap: 8px; padding: 8px 14px; font-size: .9rem } body { padding-bottom: 40px } }
.ph { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; padding-block: 24px 12px }
.ph h1 { font-size: clamp(2rem, 7vw, 2.8rem) }
.ph .acts > .btn { flex: none }
.sum { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: .92rem }
.sum b { font-family: var(--mono) }
.list { display: grid }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 0; border-bottom: 1px solid var(--hair); align-items: start }
.row .tm { font-family: var(--mono); font-weight: 600; font-size: 1.15rem; line-height: 1.15 }
.row .tm small { display: block; font-size: .75rem; color: var(--soft); font-weight: 500 }
.row .x { min-width: 0; display: grid; gap: 3px; cursor: pointer }
.row .x b { font-size: 1.05rem }
.row.iptal .x b, .row.iptal .tm { color: var(--soft); text-decoration: line-through }
.row .q { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end }
.row .det { grid-column: 2 / -1; display: grid; gap: 12px; padding: 12px 0 2px }
.row .det .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.row .det .line > .fld { flex: 1 1 150px }
@media (max-width: 560px) { .row { grid-template-columns: 56px minmax(0, 1fr) } .row .q { grid-column: 2; justify-content: start } .row .det { grid-column: 1 / -1 } }
.gap { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--hair); color: var(--soft); font-size: .88rem }
@media (max-width: 560px) { .gap { grid-template-columns: 56px 1fr } }
.gap .mono { font-size: .82rem }
.blk { background: repeating-linear-gradient(-45deg, transparent 0 7px, var(--hair) 7px 8px) }
.cn { font-size: .92rem }
.sn { font-size: .9rem; color: var(--soft); border-left: 2px solid var(--hair-2); padding-left: 8px }
.sec { padding-block: 22px 0; display: grid; gap: 12px }
.sec > h2 { font-size: 1.45rem }
.erow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center }
@media (max-width: 560px) { .erow { grid-template-columns: 1fr 1fr 44px } .erow > :first-child { grid-column: 1 / -1 } }
.xb { width: 44px; height: 44px; border-radius: var(--r); box-shadow: inset 0 0 0 1.5px var(--hair-2); font-size: 1.1rem }
.tgl { display: flex; gap: 6px; flex-wrap: wrap }
.tgl button { padding: 8px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--hair-2); font-weight: 600; font-size: .9rem }
.tgl button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none }
.cust { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 12px 0; border-bottom: 1px solid var(--hair) }
.cust .r { text-align: right; font-size: .88rem }
.member { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 0; border-bottom: 1px solid var(--hair); align-items: center }
.member .ops { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.member .ops .fld { flex: 1 1 180px }
.savebar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--band); color: var(--on-band); font-weight: 600 }
@media (min-width: 900px) { .savebar { bottom: 12px } }
.savebar .btn { background: var(--on-band); color: var(--band) }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="auth"><p class="soft">Yükleniyor…</p></div></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DAYS = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"], DAYS_L = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
const MON = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
const ST = { bekliyor: "Bekliyor", geldi: "Geldi", gelmedi: "Gelmedi", iptal: "İptal" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const toMin = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : NaN; };
const fmt = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const wd = (d) => new Date(d + "T00:00:00Z").getUTCDay();
const dnum = (d) => new Date(d + "T00:00:00Z").getUTCDate(), dmon = (d) => MON[new Date(d + "T00:00:00Z").getUTCMonth()];
const tl = (n) => (Number(n) || 0).toLocaleString("tr-TR") + " ₺";
const pretty = (p) => { const d = String(p || ""); return d.length === 11 ? `${d.slice(0, 4)} ${d.slice(4, 7)} ${d.slice(7, 9)} ${d.slice(9)}` : d; };
const ini = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toLocaleUpperCase("tr-TR");
function nowTR() { const t = new Date(Date.now() + 3 * 3600e3); return { date: t.toISOString().slice(0, 10), min: t.getUTCHours() * 60 + t.getUTCMinutes() }; }
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return "az önce"; if (m < 60) return m + " dk önce"; const h = Math.round(m / 60); if (h < 24) return h + " sa önce"; return Math.round(h / 24) + " gün önce"; }
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2800); }
async function call(path, data) {
  const r = await fetch(path, data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : { credentials: "same-origin" });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !path.includes("auth")) { me = null; renderAuth(); }
  if (!r.ok) throw new Error(j.error || "Bağlantı hatası. Tekrar dene.");
  return j;
}
const ICON = {
  ajanda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  musteri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>',
  ekip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6M15 15c2.2-.2 4.2 1 5 3.6"/></svg>',
  ayar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  hesap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>'
};
const SCISSORS = '<svg width="24" height="24" viewBox="0 0 26 26"><g fill="none" stroke="#1d1b19" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="7" r="3.3"/><circle cx="6" cy="19" r="3.3"/><path d="M9 8.6 23 17M9 17.4 23 9"/></g></svg>';

let me = null, needsSetup = false, demo = false;
let page = "ajanda";
let A = null;            // agenda payload
let range = null;
let date = null, filter = "all", openId = null, cancelAsk = null;
let sheet = null, busy = false;
let customers = null, custQ = "";
let team = null, draft = null;
let pending = false;

/* ---------- auth screens ---------- */
function renderAuth(err) {
  $("sheet").innerHTML = "";
  const r = $("root");
  if (needsSetup) {
    r.innerHTML = `<form class="auth" id="setupF" novalidate><div class="mark">${SCISSORS}</div>
      <div><h1>Dükkânını <span class="band">kur.</span></h1><p class="soft" style="margin:8px 0 0">İlk hesap dükkân sahibinin hesabıdır. Ustaları sonra Ekip bölümünden eklersin.</p></div>
      <label class="fld" for="sShop"><span>Dükkân adı</span><input id="sShop" maxlength="40" placeholder="Örn. Kemal'in Yeri" required></label>
      <label class="fld" for="sName"><span>Adın</span><input id="sName" maxlength="40" autocomplete="name" placeholder="Örn. Kemal Usta" required></label>
      <label class="fld" for="sUser"><span>Kullanıcı adı</span><input id="sUser" autocomplete="username" autocapitalize="none" placeholder="kemal" required></label>
      <label class="fld" for="sPass"><span>Şifre <span class="soft">(en az 8 karakter)</span></span><input id="sPass" type="password" autocomplete="new-password" required></label>
      <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input id="sCuts" type="checkbox" checked style="width:20px;height:20px"> Ben de müşteri alıyorum</label>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn full" type="submit">Dükkânı kur ve gir</button>
      ${demo ? `<p class="note small">Deneme modu: veritabanı bağlı değil, kayıtlar sunucu yeniden başlayınca silinir.</p>` : ""}</form>`;
    $("setupF").onsubmit = async (e) => { e.preventDefault();
      try { const j = await call("/api/auth?action=setup", { shopName: $("sShop").value, name: $("sName").value, username: $("sUser").value, password: $("sPass").value, cuts: $("sCuts").checked });
        me = j.user; needsSetup = false; boot2(); } catch (x) { renderAuth(x.message); } };
    return;
  }
  r.innerHTML = `<form class="auth" id="loginF" novalidate><div class="mark">${SCISSORS}</div>
    <div><h1>Usta <span class="band">girişi</span></h1><p class="soft" style="margin:8px 0 0">Kullanıcı adını ve şifreni dükkân sahibinden al.</p></div>
    <label class="fld" for="lUser"><span>Kullanıcı adı</span><input id="lUser" autocomplete="username" autocapitalize="none" required></label>
    <label class="fld" for="lPass"><span>Şifre</span><input id="lPass" type="password" autocomplete="current-password" required></label>
    ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn full" type="submit">Giriş yap</button>
    <a class="link small soft" href="/">Müşteri randevu sayfası</a></form>`;
  $("loginF").onsubmit = async (e) => { e.preventDefault();
    try { const j = await call("/api/auth?action=login", { username: $("lUser").value, password: $("lPass").value }); me = j.user; boot2(); } catch (x) { renderAuth(x.message); } };
  setTimeout(() => $("lUser") && $("lUser").focus(), 30);
}

/* ---------- shell ---------- */
const owner = () => me && me.role === "sahip";
function pages() { return owner() ? [["ajanda", "Ajanda"], ["musteri", "Müşteriler"], ["ekip", "Ekip"], ["ayar", "Ayarlar"]] : [["ajanda", "Ajanda"], ["musteri", "Müşteriler"], ["hesap", "Hesabım"]]; }
function typing() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox"; }
function render(force) {
  if (!me) return renderAuth();
  if (!force && (typing() || sheet)) { pending = true; return; }
  pending = false;
  const c = A ? A.cfg : null;
  document.title = (c ? c.shopName + " · " : "") + "Usta paneli";
  $("root").innerHTML = `<header class="top"><div class="shop"><b>${esc(c ? c.shopName : "")}</b><span class="lbl">Usta paneli</span></div>
    <button class="me" data-act="go" data-v="hesap" aria-label="Hesabım"><span class="av">${esc(ini(me.name))}</span><span>${esc(me.name)}</span></button></header>
    <nav class="tabs" aria-label="Menü">${pages().map(([k, l]) => `<button data-act="go" data-v="${k}" ${page === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("")}</nav>
    <main id="main">${!A ? `<p class="soft" style="padding-top:24px">Yükleniyor…</p>` : page === "ajanda" ? vAgenda() : page === "musteri" ? vCust() : page === "ekip" ? vTeam() : page === "ayar" ? vSettings() : vAccount()}</main>`;
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing() && !sheet) render(); }, 0));

async function loadAgenda(force) {
  const n = nowTR();
  const want = date || n.date;
  if (!force && A && range && want >= range[0] && want <= range[1]) return;
  const from = want < n.date ? addDays(want, -3) : addDays(n.date, -7), to = addDays(want > n.date ? want : n.date, 31);
  try { A = await call(`/api/staff?action=agenda&from=${from}&to=${to}`); range = [from, to]; me = A.me; render(); } catch (e) { if (me) toast(e.message); }
}

/* ---------- agenda ---------- */
const barbers = () => A.cfg.barbers.filter(b => b.active !== false);
const bname = (id) => (A.cfg.barbers.find(b => b.id === id) || {}).name || "Usta";
function dayLong(d) { const n = nowTR().date; return (d === n ? "Bugün" : d === addDays(n, 1) ? "Yarın" : d === addDays(n, -1) ? "Dün" : DAYS_L[wd(d)]) + ", " + dnum(d) + " " + dmon(d); }
function dshort(d) { const n = nowTR().date; return d === n ? "Bugün" : d === addDays(n, 1) ? "Yarın" : DAYS[wd(d)]; }
function vAgenda() {
  const n = nowTR(); if (!date) date = n.date;
  if (!owner()) filter = me.barberId || "all";
  else if (filter !== "all" && !barbers().some(b => b.id === filter)) filter = "all";
  const fb = (x) => filter === "all" || x.barberId === filter;
  const day = A.bookings.filter(b => b.date === date && fb(b)).sort((a, b) => a.time.localeCompare(b.time));
  const blocks = A.blocks.filter(b => b.date === date && fb(b));
  const act = day.filter(b => b.status !== "iptal");
  const ciro = act.filter(b => b.status !== "gelmedi").reduce((s, b) => s + b.price, 0);
  const closed = A.cfg.closed.includes(wd(date));
  let items = [...day.map(b => ({ t: toMin(b.time), k: "b", b })), ...mergeBlocks(blocks).map(g => ({ t: g.s, k: "k", g }))];
  if (filter !== "all" && !closed) {
    const occ = items.filter(i => i.k === "k" || i.b.status !== "iptal").map(i => i.k === "b" ? [i.t, i.t + i.b.dur] : [i.g.s, i.g.e]).sort((a, b) => a[0] - b[0]);
    let cur = toMin(A.cfg.open); const close = toMin(A.cfg.close);
    if (date === n.date) cur = Math.max(cur, Math.ceil(n.min / 30) * 30); if (date < n.date) cur = close;
    const bs = toMin(A.cfg.breakStart), be = toMin(A.cfg.breakEnd);
    if (bs < be) occ.push([bs, be]); occ.sort((a, b) => a[0] - b[0]);
    for (const [s, e] of occ) { if (s - cur >= 30) items.push({ t: cur, k: "g", s: cur, e: s }); cur = Math.max(cur, e); }
    if (close - cur >= 30) items.push({ t: cur, k: "g", s: cur, e: close });
    if (bs < be && bs >= (date === n.date ? n.min : 0) && date >= n.date) items.push({ t: bs, k: "br", s: bs, e: be });
  }
  items.sort((a, b) => a.t - b.t || (a.k === "g") - (b.k === "g"));
  const strip = Array.from({ length: 16 }, (_, i) => addDays(n.date, i - 1));
  return `<div class="ph"><div><span class="lbl">${esc(dayLong(date))}${closed ? " · kapalı gün" : ""}</span><h1>${date === n.date ? "Bugün" : esc(dshort(date) + " " + dnum(date) + " " + dmon(date))}</h1></div>
    <div class="acts"><button class="btn" data-act="newBook">+ Randevu</button><button class="btn light" data-act="newBlock">Saat kapat</button></div></div>
  <div class="days">${strip.map(d => `<button class="day" data-act="day" data-v="${d}" aria-pressed="${d === date}">${A.counts[d] ? `<span class="cnt">${A.counts[d]}</span>` : ""}<span class="dn">${dshort(d)}</span><span class="dd">${dnum(d)}</span><span class="dm">${dmon(d)}</span></button>`).join("")}
    <label class="day" style="cursor:pointer" title="Başka gün"><span class="dn">Diğer</span><span class="dd">…</span><input type="date" id="pick" value="${date}" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Gün seç"></label></div>
  ${owner() && barbers().length > 1 ? `<div class="tgl" style="margin-top:8px"><button data-act="filter" data-v="all" aria-pressed="${filter === "all"}">Tüm ustalar</button>${barbers().map(b => `<button data-act="filter" data-v="${b.id}" aria-pressed="${filter === b.id}">${esc(b.name)}</button>`).join("")}</div>` : ""}
  <div class="sum"><span><b>${act.length}</b> randevu</span><span><b>${day.filter(b => b.status === "geldi").length}</b> geldi</span><span><b>${day.filter(b => b.status === "bekliyor").length}</b> bekliyor</span><span><b>${tl(ciro)}</b> ciro</span>
    <span class="soft">Son 7 gün ${A.stats.online7} online · gelmeme %${A.stats.noshow}</span></div>
  <div class="list">${items.map(i => i.k === "b" ? rowB(i.b) : i.k === "k" ? rowK(i.g) : i.k === "br" ? `<div class="gap blk"><span class="mono">${fmt(i.s)}</span><span>Öğle arası · ${fmt(i.s)}–${fmt(i.e)}</span></div>` : `<div class="gap"><span class="mono">${fmt(i.s)}</span><span>Boş · ${fmt(i.s)}–${fmt(i.e)}</span></div>`).join("")
    || `<div class="empty" style="margin-top:14px"><b>${closed ? "Kapalı gün." : "Randevu yok."}</b> ${owner() && filter === "all" && !closed ? "Boş aralıkları görmek için bir usta seç. " : ""}Müşteriler online aldıkça burada görünür; telefonla arayanları “+ Randevu” ile ekle.</div>`}</div>`;
}
function mergeBlocks(list) {
  const g = {}; for (const b of list) (g[b.barberId + "|" + (b.group || b.label)] ||= []).push(b);
  const out = []; for (const arr of Object.values(g)) { arr.sort((a, b) => a.time.localeCompare(b.time)); let cur = null;
    for (const b of arr) { const s = toMin(b.time); if (cur && cur.e === s) { cur.e = s + b.dur; cur.ids.push(b.id); } else { cur && out.push(cur); cur = { s, e: s + b.dur, ids: [b.id], label: b.label, barberId: b.barberId }; } } cur && out.push(cur); }
  return out;
}
function rowK(g) { return `<div class="row blk"><span class="tm">${fmt(g.s)}<small>${fmt(g.e)}</small></span><div class="x"><b>${esc(g.label)}</b><span class="soft small">${owner() ? esc(bname(g.barberId)) + " · " : ""}Müşterilere kapalı</span></div><div class="q"><button class="btn light sm" data-act="unblock" data-v="${g.ids.join(",")}">Aç</button></div></div>`; }
function rowB(b) {

      ${b.history && b.history.length ? `<span class="soft small">Taşındı: ${b.history.map(h => esc(h.from.slice(5) + " → " + h.to.slice(5))).join(", ")}</span>` : ""}
    </div>` : ""}</div>`;
}
function busySet(barberId, d, ignore) {
  const s = new Set();
  for (const b of A.bookings) if (b.date === d && b.barberId === barberId && b.status !== "iptal" && b.id !== ignore) for (let m = toMin(b.time); m < toMin(b.time) + b.dur; m += 30) s.add(m);
  for (const b of A.blocks) if (b.date === d && b.barberId === barberId) s.add(toMin(b.time));
  return s;
}
function freeOpts(barberId, d, dur, ignore, cur) {
  const c = A.cfg; if (c.closed.includes(wd(d))) return `<option value="">Kapalı gün</option>`;
  const set = busySet(barberId, d, ignore), n = nowTR(), bs = toMin(c.breakStart), be = toMin(c.breakEnd), o = [];
  for (let m = toMin(c.open); m + dur <= toMin(c.close); m += 30) {
    if (d < n.date || (d === n.date && m < n.min)) continue; if (bs < be && m < be && bs < m + dur) continue;
    let ok = true; for (let x = m; x < m + dur; x += 30) if (set.has(x)) ok = false;
    if (ok) o.push(`<option value="${fmt(m)}" ${fmt(m) === cur ? "selected" : ""}>${fmt(m)}</option>`);
  }
  return o.join("") || `<option value="">Boş saat yok</option>`;
}

function readBook() { sheet.svc = $("bSvc").value; if ($("bBar")) sheet.barber = $("bBar").value; sheet.date = $("bDate").value; sheet.time = $("bTime").value; sheet.name = $("bName").value; sheet.phone = $("bPhone").value; sheet.note = $("bNote").value; }
async function saveBook() {
  readBook(); if (!sheet.time) { sheet.err = "Boş bir saat seç."; return renderSheet(); }
  busy = true; renderSheet();
  try { const r = await call("/api/staff?action=book", { serviceId: sheet.svc, barberId: sheet.barber, date: sheet.date, time: sheet.time, name: sheet.name, phone: sheet.phone, note: sheet.note });
    busy = false; date = r.booking.date; sheet = null; renderSheet(); toast(r.booking.name + " · " + r.booking.time + " eklendi"); await loadAgenda(true);
  } catch (e) { busy = false; sheet.err = e.message; renderSheet(); }
}
async function saveBlock() {
  busy = true;
  try { const r = await call("/api/staff?action=block", { barberId: owner() ? $("kBar").value : me.barberId, date: $("kDate").value, from: $("kFrom").value, to: $("kTo").value, label: $("kLabel").value, group: Math.random().toString(36).slice(2, 8) });

}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a === "close" && e.target !== el && el.classList.contains("scrim")) return;
  if (page === "ayar") readDraft();
  const act = async (path, data, ok) => { try { await call(path, data); if (ok) toast(ok); await loadAgenda(true); customers = null; } catch (x) { toast(x.message); } };
  switch (a) {
    case "go": page = v; openId = null; if (v !== "ayar") draft = null; if (v === "musteri") customers = null; if (v === "ekip") team = null; render(true); window.scrollTo(0, 0); if (v === "ajanda") loadAgenda(true); break;
    case "day": date = v; openId = null; render(true); await loadAgenda(true); break;
    case "filter": filter = v; render(true); break;
    case "open": openId = openId === v ? null : v; cancelAsk = null; render(true); break;
    case "st": await act("/api/staff?action=status", { id, status: v }, ST[v] + " olarak işaretlendi"); break;
    case "restore": await act("/api/staff?action=restore", { id }, "Randevu geri alındı"); break;
    case "note": await act("/api/staff?action=note", { id, staffNote: $("sn-" + id).value }, "Not kaydedildi"); break;
    case "move": { const t = $("mvT-" + id).value, d = $("mvD-" + id).value; if (!t) { toast("Boş bir saat seç"); break; } await act("/api/staff?action=move", { id, date: d, time: t }, "Taşındı: " + dayLong(d) + " " + t); date = d; render(true); break; }
    case "cancelAsk": cancelAsk = id; render(true); break;
    case "cancelNo": cancelAsk = null; render(true); break;
    case "cancelYes": cancelAsk = null; await act("/api/staff?action=cancel", { id }, "Randevu iptal edildi, saat açıldı"); break;
    case "unblock": await act("/api/staff?action=unblock", { ids: v.split(",") }, "Saat açıldı"); break;
    case "newBook": sheet = { kind: "book", date: date >= nowTR().date ? date : nowTR().date, barber: filter !== "all" ? filter : me.barberId }; renderSheet(); break;
    case "newBlock": sheet = { kind: "block", date: date >= nowTR().date ? date : nowTR().date }; renderSheet(); break;
    case "close": if (!busy) { sheet = null; renderSheet(); } break;
    case "chair": try { await call("/api/admin?action=ownerChair", { on: v === "1" }); team = null; await loadAgenda(true); toast("Güncellendi"); } catch (x) { toast(x.message); } render(true); break;
    case "resetPw": { const p = $("pw-" + v).value; try { await call("/api/admin?action=updateStaff", { username: v, password: p }); toast("Şifre değişti. Yeni şifreyi ustaya ilet."); team = null; render(true); } catch (x) { toast(x.message); } break; }
    case "toggleU": try { await call("/api/admin?action=updateStaff", { username: v, disabled: el.dataset.d === "1" }); team = null; await loadAgenda(true); toast("Güncellendi"); } catch (x) { toast(x.message); } render(true); break;
    case "delU": if (el.dataset.sure) { try { await call("/api/admin?action=removeStaff", { username: v }); team = null; await loadAgenda(true); toast("Hesap silindi"); } catch (x) { toast(x.message); } render(true); } else { el.dataset.sure = "1"; el.textContent = "Emin misin? Sil"; } break;
    case "closed": { const d = +v; draft.closed = draft.closed.includes(d) ? draft.closed.filter(x => x !== d) : [...draft.closed, d]; render(true); break; }
    case "addSvc": draft.services.push({ id: "s" + Date.now().toString(36), name: "Yeni hizmet", dur: 30, price: 0 }); render(true); break;
    case "delSvc": if (draft.services.length > 1) draft.services = draft.services.filter(s => s.id !== v); else toast("En az bir hizmet kalmalı"); render(true); break;
    case "resetCfg": draft = null; render(true); break;
    case "saveCfg": try { const r = await call("/api/admin?action=config", { cfg: draft }); A.cfg = r.cfg; draft = null; toast("Ayarlar kaydedildi"); } catch (x) { toast(x.message); } render(true); break;
    case "logout": await call("/api/auth?action=logout", {}).catch(() => {}); me = null; A = null; renderAuth(); break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "pick" && t.value) { date = t.value; openId = null; loadAgenda().then(() => render(true)); }
  if (t.dataset.mv) { const b = A.bookings.find(x => x.id === t.dataset.mv); $("mvT-" + b.id).innerHTML = freeOpts(b.barberId, t.value, b.dur, b.id, ""); }
  if (sheet && sheet.kind === "book" && t.hasAttribute("data-re")) { readBook(); renderSheet(); }
  if (page === "ayar" && t.closest("main")) { readDraft(); updateSaveBar(); }
});
document.addEventListener("input", (e) => { if (page === "ayar" && e.target.closest && e.target.closest("main") && draft) { readDraft(); updateSaveBar(); return; } if (e.target.id === "cq") { custQ = e.target.value; const p = e.target.selectionStart; render(true); const n = $("cq"); n.focus(); n.setSelectionRange(p, p); } });
document.addEventListener("submit", async (e) => {
  if (e.target.id === "addF") { e.preventDefault(); try { await call("/api/admin?action=addStaff", { name: $("aName").value, username: $("aUser").value, password: $("aPass").value }); toast("Usta eklendi"); team = null; await loadAgenda(true); } catch (x) { toast(x.message); } render(true); }
  if (e.target.id === "pwF") { e.preventDefault(); try { await call("/api/auth?action=password", { old: $("pOld").value, password: $("pNew").value }); toast("Şifren değişti"); render(true); } catch (x) { toast(x.message); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet && !busy) { sheet = null; renderSheet(); } });

async function boot2() { page = "ajanda"; date = null; A = null; range = null; render(true); await loadAgenda(true); }
(async () => {
  try { const r = await call("/api/auth?action=me"); me = r.user; needsSetup = r.needsSetup; demo = r.demo; } catch { $("root").innerHTML = `<div class="auth"><div class="empty"><b>Bağlanılamadı.</b> Sayfayı yenile.</div></div>`; return; }
  if (!me) return renderAuth();
  boot2();
  setInterval(() => { if (me && document.visibilityState === "visible" && page === "ajanda" && !sheet && !typing() && !openId) loadAgenda(true); }, 20000);
})();
</script>
</body>
</html>
