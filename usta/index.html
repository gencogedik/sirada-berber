<body>
<div class="wrap" id="root"><div class="auth"><p class="soft">Yükleniyor…</p></div></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DAYS = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"], DAYS_L = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
const MON = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
const ST = { talep: "Onay bekliyor", onayli: "Onaylı", geldi: "Geldi", gelmedi: "Gelmedi", iptal: "İptal", red: "Reddedildi" };
const TAG = { talep: "bekliyor", onayli: "mut", geldi: "geldi", gelmedi: "gelmedi", iptal: "iptal", red: "iptal" };
const OPEN = ["talep", "onayli"];
const STEPS = [10, 15, 20, 30, 40, 45, 60], DURS = [10, 15, 20, 30, 40, 45, 60, 75, 90, 120];
const COLORS = ["#f6d24a", "#eeb2c4", "#bccaa9", "#e9a07c", "#b9c4e8", "#d9c3f0"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const toMin = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : NaN; };
const fmt = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const wd = (d) => new Date(d + "T00:00:00Z").getUTCDay();
const dnum = (d) => new Date(d + "T00:00:00Z").getUTCDate(), dmon = (d) => MON[new Date(d + "T00:00:00Z").getUTCMonth()];
const tl = (n) => (Number(n) || 0).toLocaleString("tr-TR") + " ₺";
const pretty = (p) => { const d = String(p || ""); return d.length === 11 ? `${d.slice(0, 4)} ${d.slice(4, 7)} ${d.slice(7, 9)} ${d.slice(9)}` : d; };
const ini = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toLocaleUpperCase("tr-TR");
function nowTR() { const t = new Date(Date.now() + 3 * 3600e3); return { date: t.toISOString().slice(0, 10), min: t.getUTCHours() * 60 + t.getUTCMinutes() }; }
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return "az önce"; if (m < 60) return m + " dk önce"; const h = Math.round(m / 60); if (h < 24) return h + " sa önce"; return Math.round(h / 24) + " gün önce"; }
function until(date, time) { const [y, mo, d] = date.split("-").map(Number); const ms = Date.UTC(y, mo - 1, d, 0, toMin(time)) - 3 * 3600e3 - Date.now(); if (ms <= 0) return "şimdi"; const m = Math.round(ms / 60000), dd = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60); return dd ? `${dd} gün ${h} sa sonra` : h ? `${h} sa ${m % 60} dk sonra` : `${m} dk sonra`; }
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3000); }
async function call(path, data) {
  const r = await fetch(path, data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : {});
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !path.includes("action=login")) { me = null; A = null; renderAuth("Oturum kapandı. Tekrar giriş yap."); }
  if (!r.ok) throw new Error(j.error || "Bağlantı hatası. Tekrar dene.");
  return j;
}
const ICON = {
  ajanda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  musteri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>',
  ustalar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6M15 15c2.2-.2 4.2 1 5 3.6"/></svg>',
  saatler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  ayar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};
const SCISSORS = '<svg width="24" height="24" viewBox="0 0 26 26"><g fill="none" stroke="#1d1b19" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="7" r="3.3"/><circle cx="6" cy="19" r="3.3"/><path d="M9 8.6 23 17M9 17.4 23 9"/></g></svg>';

let me = null, shopSlug = null, page = "ajanda", A = null, range = null;
let date = null, filter = "all", openId = null, cancelAsk = null, rejectAsk = null;
let sheet = null, busy = false, customers = null, custQ = "", team = null, draft = null, editB = null, pending = false;
const lsGet = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- login ---------- */
function renderAuth(err, forgot) {
  $("sheet").innerHTML = "";
  const pre = new URLSearchParams(location.search).get("d") || lsGet("sirada_shop");
  if (forgot) {
    $("root").innerHTML = `<div class="auth"><div class="mark">${SCISSORS}</div><div><h1>Şifre <span class="band">yenileme</span></h1></div>
      <div class="note"><b>Usta isen:</b> dükkân sahibinden iste, Ustalar bölümünden yeni şifre verir.</div>
      <div class="note"><b>Dükkân sahibiysen:</b> sana bu hesabı veren Sırada yetkilisinden iste; yönetim panelinden yeni şifre oluşturur.</div>
      <button class="btn light" data-act="backLogin">Girişe dön</button></div>`;
    return;
  }
  $("root").innerHTML = `<form class="auth" id="loginF" novalidate><div class="mark">${SCISSORS}</div>
    <div><h1>Usta <span class="band">girişi</span></h1><p class="soft" style="margin:8px 0 0">Dükkân kodu, müşteri bağlantının sonundaki addır. Örn. <span class="mono">berber-01</span></p></div>
    <label class="fld" for="lShop"><span>Dükkân kodu</span><input id="lShop" autocapitalize="none" value="${esc(pre)}" placeholder="berber-01"></label>
    <label class="fld" for="lUser"><span>Kullanıcı adı</span><input id="lUser" autocomplete="username" autocapitalize="none"></label>
    <label class="fld" for="lPass"><span>Şifre</span><input id="lPass" type="password" autocomplete="current-password"></label>
    ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn full" type="submit">Giriş yap</button>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><button type="button" class="link small" data-act="forgot">Şifremi unuttum</button><a class="link small soft" href="${pre ? "/" + esc(pre) : "/"}">Müşteri sayfası</a></div></form>`;
  $("loginF").onsubmit = async (e) => { e.preventDefault();
    try { const j = await call("/api/auth?action=login", { shop: $("lShop").value, username: $("lUser").value, password: $("lPass").value }); me = j.user; shopSlug = j.shop.slug; lsSet("sirada_shop", shopSlug); boot2(); }
    catch (x) { renderAuth(x.message); } };
  setTimeout(() => { const f = pre ? $("lUser") : $("lShop"); f && f.focus(); }, 30);
}

/* ---------- shell ---------- */
const owner = () => me && me.role === "sahip";
function pages() { return owner() ? [["ajanda", "Ajanda"], ["musteri", "Müşteriler"], ["ustalar", "Ustalar"], ["ayar", "Ayarlar"]] : [["ajanda", "Ajanda"], ["musteri", "Müşteriler"], ["saatler", "Saatlerim"]]; }
function typing() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox"; }
function render(force) {
  if (!me) return renderAuth();
  if (!force && (typing() || sheet)) { pending = true; return; }
  pending = false;
  const c = A ? A.cfg : null, pc = A ? A.pending.length : 0;
  document.title = (pc ? `(${pc}) ` : "") + (c ? c.shopName + " · " : "") + "Usta paneli";
  $("root").innerHTML = `${me.imp ? `<div class="note" style="margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--ink);color:var(--paper)"><span><b style="color:var(--band)">Yönetici modu.</b> Bu dükkâna ${esc(me.imp)} olarak, sahip yetkisiyle girdin.</span><span class="acts" style="flex:none"><a class="btn y sm" href="/yonetim">Yönetime dön</a><button class="btn sm" style="background:var(--paper);color:var(--ink)" data-act="logout">Dükkândan çık</button></span></div>` : ""}<header class="top"><div class="shop"><b>${esc(c ? c.shopName : "")}</b><span class="lbl">${owner() ? "Dükkân sahibi" : "Usta paneli"}</span></div>
    <button class="me" data-act="go" data-v="hesap" aria-label="Hesabım"><span class="av">${esc(ini(me.name))}</span><span>${esc(me.name)}</span></button></header>
    <nav class="tabs" aria-label="Menü">${pages().map(([k, l]) => `<button data-act="go" data-v="${k}" ${page === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span>${k === "ajanda" && pc ? `<span class="badge">${pc}</span>` : ""}</button>`).join("")}</nav>
    <main id="main">${!A ? `<p class="soft" style="padding-top:24px">Yükleniyor…</p>` : page === "ajanda" ? vAgenda() : page === "musteri" ? vCust() : page === "ustalar" ? vTeam() : page === "ayar" ? vSettings() : page === "saatler" ? vHours(me.barberId, true) : vAccount()}</main>`;
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing() && !sheet) render(); }, 0));
async function loadAgenda(force) {
  const n = nowTR(), want = date || n.date;
  if (!force && A && range && want >= range[0] && want <= range[1]) return;
  const from = want < addDays(n.date, -7) ? addDays(want, -3) : addDays(n.date, -7), to = addDays(want > n.date ? want : n.date, 31);
  try { A = await call(`/api/staff?action=agenda&from=${from}&to=${to}`); range = [from, to]; me = A.me; shopSlug = A.shop.slug; render(); } catch (e) { if (me) toast(e.message); }
}

/* ---------- agenda ---------- */
const barbers = () => A.cfg.barbers.filter(b => b.active);
const B = (id) => A.cfg.barbers.find(b => b.id === id);
const bname = (id) => (B(id) || {}).name || "Usta";
function dayLong(d) { const n = nowTR().date; return (d === n ? "Bugün" : d === addDays(n, 1) ? "Yarın" : d === addDays(n, -1) ? "Dün" : DAYS_L[wd(d)]) + ", " + dnum(d) + " " + dmon(d); }
function dshort(d) { const n = nowTR().date; return d === n ? "Bugün" : d === addDays(n, 1) ? "Yarın" : DAYS[wd(d)]; }
function busyIv(barberId, d, ignore) {
  const iv = [];
  for (const b of A.bookings) if (b.date === d && b.barberId === barberId && OPEN.includes(b.status) && b.id !== ignore) iv.push([toMin(b.time), toMin(b.time) + b.dur]);
  for (const b of A.blocks) if (b.date === d && b.barberId === barberId) iv.push([toMin(b.time), toMin(b.time) + b.dur]);

}
function freeOpts(barberId, d, dur, ignore, cur) {

  if (b.closed.includes(wd(d))) return `<option value="">Usta bu gün çalışmıyor</option>`;
  const iv = busyIv(barberId, d, ignore), n = nowTR(), bs = toMin(b.breakStart), be = toMin(b.breakEnd), o = [];

function vAgenda() {
  const n = nowTR(); if (!date) date = n.date;

  else if (filter !== "all" && !barbers().some(b => b.id === filter)) filter = "all";
  const fb = (x) => filter === "all" || x.barberId === filter;

  const act = day.filter(b => OPEN.includes(b.status) || b.status === "geldi");
  const ciro = day.filter(b => b.status === "onayli" || b.status === "geldi").reduce((s, b) => s + b.price, 0);
  const fbar = filter !== "all" ? B(filter) : null;
  const closed = fbar ? fbar.closed.includes(wd(date)) : barbers().every(b => b.closed.includes(wd(date)));
  let items = [...day.map(b => ({ t: toMin(b.time), k: "b", b })), ...blocks.map(g => ({ t: toMin(g.time), k: "k", g }))];
  if (fbar && !closed) {
    const occ = items.filter(i => i.k === "k" || OPEN.includes(i.b.status)).map(i => i.k === "b" ? [i.t, i.t + i.b.dur] : [i.t, i.t + i.g.dur]);
    let cur = toMin(fbar.open); const close = toMin(fbar.close);
    if (date === n.date) cur = Math.max(cur, Math.ceil(n.min / 5) * 5); if (date < n.date) cur = close;
    const bs = toMin(fbar.breakStart), be = toMin(fbar.breakEnd); if (bs < be) occ.push([bs, be]);
    occ.sort((a, b) => a[0] - b[0]);
    for (const [s, e] of occ) { if (s - cur >= fbar.step) items.push({ t: cur, k: "g", s: cur, e: s }); cur = Math.max(cur, e); }
    if (close - cur >= fbar.step) items.push({ t: cur, k: "g", s: cur, e: close });
    if (bs < be && date >= n.date) items.push({ t: bs, k: "br", s: bs, e: be });
  }
  items.sort((a, b) => a.t - b.t || (a.k === "g") - (b.k === "g"));

  ${A.pending.length ? `<div class="inbox"><div class="h"><b>Onay bekleyen ${A.pending.length} talep</b><span class="soft small">Onaylayınca kesinleşir</span></div>
    ${A.pending.slice(0, 20).map(p => `<div class="req"><span class="tm">${p.time}<small>${esc(dshort(p.date))} ${dnum(p.date)} ${dmon(p.date)}</small></span>
      <div style="min-width:0"><b>${esc(p.name)}</b> <span class="soft small">· ${esc(p.serviceName)}${owner() && barbers().length > 1 ? " · " + esc(bname(p.barberId)) : ""} · ${ago(p.createdAt)}</span>${p.note ? `<div class="cn"><span class="band">${esc(p.note)}</span></div>` : ""}
        ${rejectAsk === p.id ? `<div class="line" style="margin-top:8px"><label class="fld" for="rr-${p.id}"><span>Neden? <span class="soft">(isteğe bağlı)</span></span><input id="rr-${p.id}" maxlength="120" placeholder="Örn. o saatte doluyum"></label><button class="btn light sm" data-act="rejNo">Vazgeç</button><button class="btn danger sm" data-act="rejYes" data-id="${p.id}">Reddet</button></div>` : ""}</div>
      <div class="q">${rejectAsk === p.id ? "" : `<button class="btn sm" data-act="approve" data-id="${p.id}">Onayla</button><button class="btn light sm" data-act="rejAsk" data-id="${p.id}">Reddet</button>`}</div></div>`).join("")}</div>` : ""}
  <div class="days">${strip.map(d => `<button class="day" data-act="day" data-v="${d}" aria-pressed="${d === date}">${A.counts[d] ? `<span class="cnt">${A.counts[d]}</span>` : ""}<span class="dn">${dshort(d)}</span><span class="dd">${dnum(d)}</span><span class="dm">${dmon(d)}</span></button>`).join("")}
    <label class="day" style="cursor:pointer" title="Başka gün"><span class="dn">Diğer</span><span class="dd">…</span><input type="date" id="pick" value="${date}" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Gün seç"></label></div>
  ${owner() && barbers().length > 1 ? `<div class="tgl" style="margin-top:8px"><button data-act="filter" data-v="all" aria-pressed="${filter === "all"}">Tüm ustalar</button>${barbers().map(b => `<button data-act="filter" data-v="${b.id}" aria-pressed="${filter === b.id}">${esc(b.name)}</button>`).join("")}</div>` : ""}
  <div class="sum"><span><b>${act.length}</b> randevu</span><span><b>${day.filter(b => b.status === "talep").length}</b> onay bekliyor</span><span><b>${day.filter(b => b.status === "geldi").length}</b> geldi</span><span><b>${tl(ciro)}</b> ciro</span>
    <span class="soft">Son 7 gün ${A.stats.online7} online · gelmeme %${A.stats.noshow}</span>${fbar ? `<span class="soft">${fbar.step} dk dilim</span>` : ""}</div>
  <div class="list">${items.map(i => i.k === "b" ? rowB(i.b) : i.k === "k" ? rowK(i.g) : i.k === "br" ? `<div class="gap blk"><span class="mono">${fmt(i.s)}</span><span>Öğle arası · ${fmt(i.s)}–${fmt(i.e)}</span></div>` : `<div class="gap"><span class="mono">${fmt(i.s)}</span><span>Boş · ${fmt(i.s)}–${fmt(i.e)}</span></div>`).join("")
    || `<div class="empty" style="margin-top:14px"><b>${closed ? "Kapalı gün." : "Randevu yok."}</b> ${owner() && filter === "all" && !closed ? "Boş aralıkları görmek için bir usta seç. " : ""}Müşteriler online talep gönderdikçe yukarıda onayına düşer; telefonla arayanları “+ Randevu” ile ekle.</div>`}</div>`;

      </div>${sheet.err ? `<div class="err">${esc(sheet.err)}</div>` : ""}

      <div class="grid2">

        <label class="fld" for="kDate"><span>Gün</span><input type="date" id="kDate" value="${sheet.date}" min="${nowTR().date}"></label>
        <label class="fld" for="kFrom"><span>Başlangıç</span><select id="kFrom">${opts.slice(0, -1).map(o => `<option>${o}</option>`).join("")}</select></label>
        <label class="fld" for="kTo"><span>Bitiş</span><select id="kTo">${opts.slice(1).map((o, i) => `<option ${i === 11 ? "selected" : ""}>${o}</option>`).join("")}</select></label>

function readBook() { sheet.svc = $("bSvc").value; if ($("bBar")) sheet.barber = $("bBar").value; sheet.date = $("bDate").value; sheet.time = $("bTime").value; sheet.name = $("bName").value; sheet.phone = $("bPhone").value; sheet.note = $("bNote").value; }
async function saveBook() {
  readBook(); if (!sheet.time) { sheet.err = "Boş bir saat seç."; return renderSheet(); }
  busy = true; renderSheet();
  try { const r = await call("/api/staff?action=book", { serviceId: sheet.svc, barberId: sheet.barber, date: sheet.date, time: sheet.time, name: sheet.name, phone: sheet.phone, note: sheet.note });
    busy = false; date = r.booking.date; sheet = null; renderSheet(); toast(r.booking.name + " · " + r.booking.time + " eklendi"); await loadAgenda(true);
  } catch (e) { busy = false; sheet.err = e.message; renderSheet(); }
}
async function saveBlock() {
  busy = true;
  try { const bid = owner() ? $("kBar").value : me.barberId; const r = await call("/api/staff?action=block", { barberId: bid, date: $("kDate").value, from: $("kFrom").value, to: $("kTo").value, label: $("kLabel").value });
    busy = false; date = $("kDate").value; sheet = null; renderSheet(); toast(r.skipped ? "Kapatıldı · dolu dakikalar atlandı" : "Saat kapatıldı"); await loadAgenda(true);
  } catch (e) { busy = false; sheet.err = e.message; renderSheet(); }
}

  return `<div class="ph"><div><span class="lbl">${team.barbers.filter(b => b.active).length} usta randevu alıyor</span><h1>Ustalar</h1></div><div class="acts"><button class="btn" data-act="addOpen">+ Usta ekle</button></div></div>
    ${editB === "new" ? addForm() : ""}
    <div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><span><b>Ben de müşteri alıyorum</b><br>Açıksa müşteriler seni de usta olarak seçebilir.</span><button class="btn ${meChair && meChair.active ? "" : "light"} sm" data-act="chair" data-v="${meChair && meChair.active ? 0 : 1}">${meChair && meChair.active ? "Açık" : "Kapalı"}</button></div>
    <div class="cards">${team.barbers.map((b, i) => bCard(b, i)).join("") || `<div class="empty"><b>Henüz usta yok.</b> “+ Usta ekle” ile ilk koltuğu oluştur ya da kendi koltuğunu aç.</div>`}</div>`;
}
function bCard(b, i) {
  const open = editB === b.id, l = b.login;
  return `<div class="bc ${b.active ? "" : "off"}"><div class="hd"><span class="av" style="background:${COLORS[i % COLORS.length]}">${esc(ini(b.name))}</span>
      <b>${esc(b.name)}${b.id === me.barberId ? ' <span class="tag mut">Sen</span>' : ""}${b.active ? "" : ' <span class="tag iptal">Gizli</span>'}</b>
      <button class="btn light sm" data-act="editB" data-v="${b.id}" style="grid-row:span 2">${open ? "Kapat" : "Düzenle"}</button>
      <span class="soft small">${b.title ? esc(b.title) + " · " : ""}${b.step} dk dilim · ${esc(b.open)}–${esc(b.close)}${b.closed.length ? " · " + b.closed.map(d => DAYS[d]).join(", ") + " izinli" : ""} · ${l ? "giriş: <span class='mono'>" + esc(l.username) + "</span>" + (l.disabled ? " (kapalı)" : "") : "giriş hesabı yok"}</span></div>
    ${open ? `<form class="line" data-rename="${b.id}" novalidate><label class="fld" for="bn-${b.id}"><span>Ad</span><input id="bn-${b.id}" maxlength="40" value="${esc(b.name)}"></label><button class="btn light sm" type="submit">Adı kaydet</button></form>
      ${vHours(b.id, false, team.barbers)}
      <div class="sec" style="padding-top:6px"><h2 style="font-size:1.2rem">Giriş hesabı</h2>
        ${l ? `<div class="line"><label class="fld" for="pw-${b.id}"><span>Yeni şifre <span class="soft">(${esc(l.username)})</span></span><input id="pw-${b.id}" type="text" autocomplete="off" placeholder="En az 8 karakter"></label><button class="btn light sm" data-act="resetPw" data-v="${b.id}">Şifreyi değiştir</button>
            ${l.role !== "sahip" ? `<button class="btn light sm" data-act="toggleLogin" data-v="${b.id}" data-d="${l.disabled ? 0 : 1}">${l.disabled ? "Girişi aç" : "Girişi kapat"}</button>` : ""}</div>`
          : `<div class="line"><label class="fld" for="lu-${b.id}"><span>Kullanıcı adı</span><input id="lu-${b.id}" autocapitalize="none" placeholder="usta"></label><label class="fld" for="lp-${b.id}"><span>Şifre</span><input id="lp-${b.id}" type="text" value="${genPw()}"></label><button class="btn light sm" data-act="giveLogin" data-v="${b.id}">Giriş hesabı ver</button></div>`}
      </div>
      ${b.id !== me.barberId ? `<div class="line" style="border-top:1px solid var(--hair);padding-top:12px"><button class="btn light sm" data-act="hideB" data-v="${b.id}" data-d="${b.active ? 0 : 1}">${b.active ? "Müşterilerden gizle" : "Yeniden göster"}</button><button class="btn danger sm" data-act="delB" data-v="${b.id}">Ustayı sil</button></div>` : ""}` : ""}
  </div>`;
}
function addForm() {
  return `<form class="bc" id="addF" novalidate style="margin-bottom:12px"><h2 style="font-size:1.4rem">Yeni usta</h2>
    <div class="grid2"><label class="fld" for="aName"><span>Ad</span><input id="aName" maxlength="40" placeholder="Örn. Emre"></label>
      <label class="fld" for="aTitle"><span>Unvan <span class="soft">(isteğe bağlı)</span></span><input id="aTitle" maxlength="40" placeholder="Örn. Sakal ustası"></label>
      <label class="fld" for="aStep"><span>Randevu dilimi</span><select id="aStep">${STEPS.map(s => `<option value="${s}" ${s === 30 ? "selected" : ""}>${s} dakikada bir</option>`).join("")}</select></label></div>
    <label class="switch"><input type="checkbox" id="aLogin" checked> Ustaya giriş hesabı ver <span class="soft" style="font-weight:400">(kendi ajandasını görür, talepleri onaylar)</span></label>
    <div class="grid2" id="aLoginF"><label class="fld" for="aUser"><span>Kullanıcı adı</span><input id="aUser" autocapitalize="none" placeholder="emre"></label><label class="fld" for="aPass"><span>Geçici şifre</span><input id="aPass" type="text" value="${genPw()}"></label></div>
    <div class="acts"><button type="button" class="btn light" data-act="addClose">Vazgeç</button><button class="btn" type="submit">Ustayı ekle</button></div>
    <p class="soft small" style="margin:0">Ustaya dükkân kodunu (<span class="mono">${esc(shopSlug)}</span>), kullanıcı adını ve şifreyi ilet; /usta adresinden girer.</p></form>`;
}
function genPw() { const a = "abcdefghjkmnpqrstuvwxyz23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(10)), x => a[x % a.length]).join(""); }

/* ---------- settings (owner) ---------- */
const cfgBase = () => { const { barbers, ...rest } = A.cfg; return { ...JSON.parse(JSON.stringify(rest)), slug: shopSlug }; };
function vSettings() {
  const c = draft || (draft = cfgBase());
  const hrs = []; for (let m = 360; m <= 1430; m += 30) hrs.push(fmt(m));
  const sel = (id, v, empty) => `<select id="${id}">${empty ? `<option value="">${empty}</option>` : ""}${hrs.map(h => `<option ${h === v ? "selected" : ""}>${h}</option>`).join("")}</select>`;
  const opt = (id, v, list) => `<select id="${id}">${list.map(([x, l]) => `<option value="${x}" ${+v === x ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const link = location.origin + "/" + shopSlug;
  return `<div class="ph"><div><span class="lbl">Müşteri sayfasında görünür</span><h1>Ayarlar</h1></div></div>
    <div class="linkbox"><span class="soft small">Müşteri bağlantın</span><span class="mono">${esc(link)}</span><button class="btn light sm" data-act="copy" data-v="${esc(link)}">Kopyala</button><a class="btn light sm" href="/${esc(shopSlug)}" target="_blank" rel="noopener">Aç</a></div>
    <div class="sec"><h2>Dükkân</h2><div class="grid2">
      <label class="fld" for="cShop"><span>Dükkân adı</span><input id="cShop" maxlength="40" value="${esc(c.shopName)}"></label>
      <label class="fld" for="cSlug"><span>Bağlantı adı</span><input id="cSlug" maxlength="30" autocapitalize="none" value="${esc(c.slug)}"></label>
      <label class="fld" for="cAddr"><span>Adres</span><input id="cAddr" maxlength="90" value="${esc(c.address)}" placeholder="Mahalle, sokak, ilçe"></label>
      <label class="fld" for="cPhone"><span>Telefon</span><input id="cPhone" maxlength="20" type="tel" value="${esc(c.phone)}" placeholder="0216 xxx xx xx"></label></div>
      <p class="soft small" style="margin:0">Bağlantı adını değiştirirsen eski bağlantı çalışmaz; yenisini müşterilerinle paylaş.</p></div>
    <div class="sec"><h2>Dükkân saatleri</h2><p class="soft small" style="margin:-6px 0 0">Kendi saatini ayarlamayan ustalar bu saatlerle çalışır.</p><div class="grid2">
      <label class="fld" for="cOpen"><span>Açılış</span>${sel("cOpen", c.open)}</label><label class="fld" for="cClose"><span>Kapanış</span>${sel("cClose", c.close)}</label>
      <label class="fld" for="cBs"><span>Öğle arası başı</span>${sel("cBs", c.breakStart, "Ara yok")}</label><label class="fld" for="cBe"><span>Öğle arası sonu</span>${sel("cBe", c.breakEnd, "Ara yok")}</label></div>
      <div class="fld"><span>Kapalı günler</span><div class="tgl">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button data-act="closed" data-v="${d}" aria-pressed="${c.closed.includes(d)}">${DAYS_L[d]}</button>`).join("")}</div></div></div>
    <div class="sec"><h2>Randevu kuralları</h2><div class="grid2">
      <label class="fld" for="cHor"><span>Kaç gün ilerisi açık</span>${opt("cHor", c.horizon, [[7, "7 gün"], [14, "14 gün"], [21, "21 gün"], [30, "30 gün"]])}</label>
      <label class="fld" for="cMin"><span>En geç ne kadar önce alınır</span>${opt("cMin", c.minNotice, [[0, "Son ana kadar"], [30, "30 dk önce"], [60, "1 saat önce"], [120, "2 saat önce"], [240, "4 saat önce"]])}</label>
      <label class="fld" for="cCan"><span>Müşteri en geç ne zaman iptal eder</span>${opt("cCan", c.cancelHours, [[0, "Son ana kadar"], [1, "1 saat önce"], [2, "2 saat önce"], [6, "6 saat önce"], [24, "1 gün önce"]])}</label></div></div>
    <div class="sec"><h2>Hizmetler</h2>${c.services.map(s => `<div class="erow"><input aria-label="Hizmet adı" id="sN-${s.id}" maxlength="40" value="${esc(s.name)}">
      <select aria-label="Süre" id="sD-${s.id}">${DURS.map(d => `<option value="${d}" ${s.dur === d ? "selected" : ""}>${d} dk</option>`).join("")}</select>
      <input aria-label="Fiyat (TL)" id="sP-${s.id}" type="number" min="0" step="10" value="${s.price}"><button class="xb" data-act="delSvc" data-v="${s.id}" aria-label="${esc(s.name)} sil">×</button></div>`).join("")}
      <div><button class="btn light sm" data-act="addSvc">+ Hizmet ekle</button></div></div>
    ${saveBar(JSON.stringify(c) !== JSON.stringify(cfgBase()))}`;
}
function saveBar(changed) { return `<div class="savebar" id="saveBar" data-changed="${changed ? 1 : 0}"><span>${changed ? "Kaydedilmemiş değişiklik var" : "Ayarlar güncel"}</span><span class="acts" style="flex:none">${changed ? `<button class="btn light sm" data-act="resetCfg" style="box-shadow:inset 0 0 0 1.5px var(--on-band);color:var(--on-band)">Geri al</button>` : ""}<button class="btn sm" data-act="saveCfg" ${changed ? "" : "disabled"}>Kaydet</button></span></div>`; }
// Only redraw the bar when its state flips, so a click on "Kaydet" that blurs a field is not lost.
function updateSaveBar() { const b = $("saveBar"); const ch = JSON.stringify(draft) !== JSON.stringify(cfgBase()); if (b && b.dataset.changed !== (ch ? "1" : "0")) b.outerHTML = saveBar(ch); }
function readDraft() {
  if (!draft || !$("cShop")) return; const v = (i) => $(i).value;
  Object.assign(draft, { shopName: v("cShop"), slug: v("cSlug").trim().toLowerCase(), address: v("cAddr"), phone: v("cPhone"), open: v("cOpen"), close: v("cClose"), breakStart: v("cBs"), breakEnd: v("cBe"), horizon: +v("cHor"), minNotice: +v("cMin"), cancelHours: +v("cCan") });
  draft.services.forEach(s => { if ($("sN-" + s.id)) { s.name = v("sN-" + s.id); s.dur = +v("sD-" + s.id); s.price = Math.max(0, Math.round(+v("sP-" + s.id) || 0)); } });
}

/* ---------- account ---------- */
function vAccount() {
  const link = location.origin + "/" + shopSlug;
  return `<div class="ph"><div><span class="lbl">${owner() ? "Dükkân sahibi" : "Usta"} · ${esc(shopSlug)}</span><h1>Hesabım</h1></div></div>
    <div class="rows" style="max-width:520px"><div><span>Kullanıcı adı</span><span class="mono">${esc(me.username)}</span></div><div><span>Dükkân kodu</span><span class="mono">${esc(shopSlug)}</span></div></div>
    <div class="linkbox" style="margin-top:12px;max-width:520px"><span class="mono">${esc(link)}</span><button class="btn light sm" data-act="copy" data-v="${esc(link)}">Bağlantıyı kopyala</button></div>
    <form class="sec" id="nmF" novalidate style="max-width:520px"><h2>Adım</h2><div class="line"><label class="fld" for="nName"><span>Görünen ad</span><input id="nName" maxlength="40" value="${esc(me.name)}"></label><button class="btn light" type="submit">Kaydet</button></div></form>
    <form class="sec" id="pwF" novalidate style="max-width:520px"><h2>Şifre değiştir</h2>
      <label class="fld" for="pOld"><span>Mevcut şifre</span><input id="pOld" type="password" autocomplete="current-password"></label>
      <label class="fld" for="pNew"><span>Yeni şifre <span class="soft">(en az 8 karakter)</span></span><input id="pNew" type="password" autocomplete="new-password"></label>
      <div><button class="btn" type="submit">Şifreyi değiştir</button></div></form>
    <div class="sec"><div><button class="btn light" data-act="logout">Çıkış yap</button></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a === "close" && e.target !== el && el.classList.contains("scrim")) return;
  if (page === "ayar") readDraft();
  const act = async (path, data, ok) => { try { await call(path, data); if (ok) toast(ok); customers = null; team = null; await loadAgenda(true); } catch (x) { toast(x.message); } };
  switch (a) {
    case "forgot": renderAuth(null, true); break;
    case "backLogin": renderAuth(); break;
    case "go": page = v; openId = null; editB = null; if (v !== "ayar") draft = null; if (v === "musteri") customers = null; if (v === "ustalar") team = null; render(true); window.scrollTo(0, 0); if (v === "ajanda") loadAgenda(true); break;
    case "day": date = v; openId = null; render(true); await loadAgenda(true); break;
    case "filter": filter = v; render(true); break;
    case "open": openId = openId === v ? null : v; cancelAsk = null; render(true); break;
    case "approve": await act("/api/staff?action=approve", { id }, "Onaylandı"); break;
    case "rejAsk": rejectAsk = id; render(true); setTimeout(() => $("rr-" + id) && $("rr-" + id).focus(), 20); break;
    case "rejNo": rejectAsk = null; render(true); break;
    case "rejYes": { const r = ($("rr-" + id) || {}).value || ""; rejectAsk = null; await act("/api/staff?action=reject", { id, reason: r }, "Reddedildi, saat açıldı"); break; }
    case "st": await act("/api/staff?action=status", { id, status: v }, ST[v] + " olarak işaretlendi"); break;
    case "restore": await act("/api/staff?action=restore", { id }, "Randevu geri alındı"); break;
    case "note": await act("/api/staff?action=note", { id, staffNote: $("sn-" + id).value }, "Not kaydedildi"); break;
    case "move": { const t = $("mvT-" + id).value, d = $("mvD-" + id).value; if (!t) { toast("Boş bir saat seç"); break; } date = d; await act("/api/staff?action=move", { id, date: d, time: t }, "Taşındı: " + dayLong(d) + " " + t); break; }
    case "cancelAsk": cancelAsk = id; render(true); break;
    case "cancelNo": cancelAsk = null; render(true); break;
    case "cancelYes": cancelAsk = null; await act("/api/staff?action=cancel", { id }, "Randevu iptal edildi, saat açıldı"); break;
    case "unblock": await act("/api/staff?action=unblock", { id: v }, "Saat açıldı"); break;
    case "newBook": sheet = { kind: "book", date: date >= nowTR().date ? date : nowTR().date, barber: filter !== "all" ? filter : me.barberId }; renderSheet(); break;
    case "newBlock": sheet = { kind: "block", date: date >= nowTR().date ? date : nowTR().date, barber: owner() ? (filter !== "all" ? filter : "all") : me.barberId }; renderSheet(); break;
    case "close": if (!busy) { sheet = null; renderSheet(); } break;
    case "hday": el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") === "true" ? "false" : "true"); break;
    case "addOpen": editB = "new"; render(true); setTimeout(() => $("aName") && $("aName").focus(), 20); break;
    case "addClose": editB = null; render(true); break;
    case "editB": editB = editB === v ? null : v; render(true); break;
    case "chair": try { await call("/api/admin?action=ownerChair", { on: v === "1" }); team = null; await loadAgenda(true); toast("Güncellendi"); } catch (x) { toast(x.message); } render(true); break;
    case "resetPw": try { await call("/api/admin?action=login", { barberId: v, password: $("pw-" + v).value }); toast("Şifre değişti; yenisini ustaya ilet"); team = null; } catch (x) { toast(x.message); } render(true); break;
    case "toggleLogin": try { await call("/api/admin?action=login", { barberId: v, disabled: el.dataset.d === "1" }); toast("Güncellendi"); team = null; } catch (x) { toast(x.message); } render(true); break;
    case "giveLogin": try { await call("/api/admin?action=login", { barberId: v, username: $("lu-" + v).value, password: $("lp-" + v).value }); toast("Giriş hesabı verildi"); team = null; } catch (x) { toast(x.message); } render(true); break;
    case "hideB": try { await call("/api/admin?action=barber", { barberId: v, active: el.dataset.d === "1" }); team = null; await loadAgenda(true); toast("Güncellendi"); } catch (x) { toast(x.message); } render(true); break;
    case "delB": if (el.dataset.sure) { try { await call("/api/admin?action=removeBarber", { barberId: v }); editB = null; team = null; await loadAgenda(true); toast("Usta silindi"); } catch (x) { toast(x.message); } render(true); } else { el.dataset.sure = "1"; el.textContent = "Emin misin? Sil"; } break;
    case "closed": { const d = +v; draft.closed = draft.closed.includes(d) ? draft.closed.filter(x => x !== d) : [...draft.closed, d]; render(true); break; }
    case "addSvc": draft.services.push({ id: "s" + Date.now().toString(36), name: "Yeni hizmet", dur: 30, price: 0 }); render(true); break;
    case "delSvc": if (draft.services.length > 1) draft.services = draft.services.filter(s => s.id !== v); else toast("En az bir hizmet kalmalı"); render(true); break;
    case "resetCfg": draft = null; render(true); break;
    case "saveCfg": try { const r = await call("/api/admin?action=config", { cfg: draft }); shopSlug = r.slug; lsSet("sirada_shop", shopSlug); draft = null; toast("Ayarlar kaydedildi"); await loadAgenda(true); } catch (x) { toast(x.message); } render(true); break;
    case "copy": try { await navigator.clipboard.writeText(v); toast("Kopyalandı"); } catch { prompt("Kopyala:", v); } break;
    case "logout": await call("/api/auth?action=logout", {}).catch(() => {}); me = null; A = null; renderAuth(); break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "pick" && t.value) { date = t.value; openId = null; loadAgenda().then(() => render(true)); }
  if (t.dataset.mv) { const b = A.bookings.find(x => x.id === t.dataset.mv); $("mvT-" + b.id).innerHTML = freeOpts(b.barberId, t.value, b.dur, b.id, ""); }
  if (sheet && t.hasAttribute("data-re")) { if (sheet.kind === "book") readBook(); else sheet.barber = $("kBar").value; renderSheet(); }
  if (t.dataset.own) { const box = $(t.dataset.own + "hrs"); if (box) box.hidden = !t.checked; }
  if (t.id === "aLogin") $("aLoginF").hidden = !t.checked;
  if (page === "ayar" && t.closest("main")) { readDraft(); updateSaveBar(); }
});
document.addEventListener("input", (e) => {
  if (page === "ayar" && e.target.closest && e.target.closest("main") && draft) { readDraft(); updateSaveBar(); return; }
  if (e.target.id === "cq") { custQ = e.target.value; const p = e.target.selectionStart; render(true); const n = $("cq"); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener("submit", async (e) => {
  const f = e.target;
  if (f.dataset.hf) { e.preventDefault(); const bid = f.dataset.hf; try { await call("/api/staff?action=schedule", readHours("h" + bid + "_", bid)); toast("Saatler kaydedildi"); team = null; await loadAgenda(true); } catch (x) { toast(x.message); } render(true); }
  if (f.dataset.rename) { e.preventDefault(); const bid = f.dataset.rename; try { await call("/api/admin?action=barber", { barberId: bid, name: $("bn-" + bid).value }); toast("Ad kaydedildi"); team = null; await loadAgenda(true); } catch (x) { toast(x.message); } render(true); }
  if (f.id === "addF") { e.preventDefault(); const login = $("aLogin").checked;
    try { await call("/api/admin?action=addBarber", { name: $("aName").value, title: $("aTitle").value, step: +$("aStep").value, ...(login ? { username: $("aUser").value, password: $("aPass").value } : {}) }); toast("Usta eklendi"); editB = null; team = null; await loadAgenda(true); } catch (x) { toast(x.message); } render(true); }
  if (f.id === "pwF") { e.preventDefault(); try { await call("/api/auth?action=password", { old: $("pOld").value, password: $("pNew").value }); toast("Şifren değişti"); render(true); } catch (x) { toast(x.message); } }
  if (f.id === "nmF") { e.preventDefault(); try { const r = await call("/api/auth?action=name", { name: $("nName").value }); me = r.user; toast("Kaydedildi"); await loadAgenda(true); } catch (x) { toast(x.message); } render(true); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet && !busy) { sheet = null; renderSheet(); } });

async function boot2() { page = "ajanda"; date = null; A = null; range = null; render(true); await loadAgenda(true); }
(async () => {
  try { const r = await call("/api/auth?action=me"); me = r.user; if (r.shop) { shopSlug = r.shop.slug; lsSet("sirada_shop", shopSlug); } } catch { $("root").innerHTML = `<div class="auth"><div class="empty"><b>Bağlanılamadı.</b> Sayfayı yenile.</div></div>`; return; }
  if (!me) return renderAuth();
  boot2();
  setInterval(() => { if (me && document.visibilityState === "visible" && page === "ajanda" && !sheet && !typing() && !openId && !rejectAsk) loadAgenda(true); }, 20000);
})();
</script>
</body>
</html>
