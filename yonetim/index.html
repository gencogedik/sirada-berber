<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sırada Yönetim</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f0e7">
<meta name="color-scheme" content="light only">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/base.css?v=4">
<style>
.wrap { max-width: 980px }
.auth { max-width: 400px; margin: 9vh auto 0; display: grid; gap: 18px }
.auth h1 { font-size: 2.6rem }
.mark { width: 44px; height: 44px; border-radius: 12px; background: var(--ink); display: grid; place-items: center }
header.top { display: flex; align-items: center; gap: 12px; padding-block: 16px 10px; border-bottom: 1px solid var(--hair) }
header.top b { font-family: var(--serif); font-weight: 400; font-size: 1.35rem; margin-right: auto }
.ph { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; padding-block: 24px 12px }
.ph h1 { font-size: clamp(2rem, 7vw, 2.8rem) }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-radius: 14px; background: var(--card); margin-bottom: 16px }
.kpis > div { padding: 12px 14px; border-left: 1px solid var(--hair) } .kpis > div:first-child { border-left: 0 }
.kpis b { display: block; font-family: var(--mono); font-size: 1.5rem }
@media (max-width: 600px) { .kpis { grid-template-columns: 1fr 1fr } .kpis > div:nth-child(3) { border-left: 0 } .kpis > div:nth-child(n+3) { border-top: 1px solid var(--hair) } }
.tbl { overflow-x: auto; border-top: 1px solid var(--ink) }
table { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 760px }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); font-weight: 600; padding: 10px 8px; border-bottom: 1px solid var(--hair) }
td { padding: 11px 8px; border-bottom: 1px solid var(--hair); vertical-align: top }
td.n, th.n { text-align: right; font-family: var(--mono) }
tr.off td { color: var(--soft) }
.creds { border-radius: 14px; background: var(--band); color: var(--on-band); padding: 16px; display: grid; gap: 12px; margin-bottom: 18px }
.creds table { min-width: 560px; font-family: var(--mono); font-size: .88rem }
.creds th, .creds td { border-color: color-mix(in srgb, var(--on-band) 20%, transparent); color: var(--on-band) }
.creds .btn { background: var(--on-band); color: var(--band) }
.mini { display: flex; gap: 6px; flex-wrap: wrap }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.inline .fld { flex: 1 1 140px }
.det { border-radius: 16px; background: var(--card); padding: 18px; display: grid; gap: 16px; margin-bottom: 18px; box-shadow: inset 0 0 0 1.5px var(--ink) }
.det h2 { font-size: 1.8rem }
.urow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 12px 0; border-top: 1px solid var(--hair) }
.urow .meta { grid-column: 1 / -1; font-size: .85rem; color: var(--soft) }
@media (max-width: 640px) { .urow { grid-template-columns: 1fr } }
.state { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--paper); font-size: .93rem }
.state .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ok) }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="auth"><p class="soft">Yükleniyor…</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3000); }
async function call(action, data) {
  const r = await fetch("/api/platform?action=" + action, data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : {});
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !["login", "setup"].includes(action)) { admin = null; renderAuth("Oturum kapandı. Tekrar giriş yap."); }
  if (!r.ok) throw new Error(j.error || "Bağlantı hatası.");
  return j;
}
const MARK = '<svg width="24" height="24" viewBox="0 0 26 26"><g fill="none" stroke="#f6d24a" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="7" r="3.3"/><circle cx="6" cy="19" r="3.3"/><path d="M9 8.6 23 17M9 17.4 23 9"/></g></svg>';
const day = (ts) => ts ? new Date(ts).toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) : "—";
let admin = null, needsSetup = false, shops = null, made = null, reset = null, editSlug = null, detail = null, D = null, delAsk = false;
let picked = new Set(), bulkAsk = false, rowAsk = null, admins = null, adminDel = null;

function renderAuth(err) {
  $("root").innerHTML = needsSetup
    ? `<form class="auth" id="sf" novalidate><div class="mark">${MARK}</div><div><h1>Yönetici <span class="band">hesabı</span></h1><p class="soft" style="margin:8px 0 0">Sırada'yı berberlere satan kişinin hesabı. Dükkân hesaplarını buradan oluşturur, şifrelerini yenilersin. Bir kez kurulur.</p></div>
      <label class="fld" for="u"><span>Kullanıcı adı</span><input id="u" autocapitalize="none" autocomplete="username"></label>
      <label class="fld" for="p"><span>Şifre <span class="soft">(en az 10 karakter)</span></span><input id="p" type="password" autocomplete="new-password"></label>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn full" type="submit">Yönetici hesabını kur</button></form>`
    : `<form class="auth" id="lf" novalidate><div class="mark">${MARK}</div><div><h1>Sırada <span class="band">yönetim</span></h1></div>
      <label class="fld" for="u"><span>Kullanıcı adı</span><input id="u" autocapitalize="none" autocomplete="username"></label>
      <label class="fld" for="p"><span>Şifre</span><input id="p" type="password" autocomplete="current-password"></label>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn full" type="submit">Giriş yap</button></form>`;
  const f = $("sf") || $("lf");
  f.onsubmit = async (e) => { e.preventDefault();
    try { const r = await call(needsSetup ? "setup" : "login", { username: $("u").value, password: $("p").value }); admin = r.admin; needsSetup = false;
      if (r.moved) toast("Eski dükkân verileri “" + r.moved + "” bağlantısına taşındı"); load(); } catch (x) { renderAuth(x.message); } };
}
async function load() { try { admins = await call("admins"); } catch {} try { shops = (await call("shops")).shops; const ids = new Set(shops.map(x => x.id)); picked = new Set([...picked].filter(x => ids.has(x))); } catch (e) { toast(e.message); } render(); }
function render() {
  if (!admin) return renderAuth();
  const list = shops || [], origin = location.origin;
  const sold = list.filter(s => s.barbers > 0).length;
  $("root").innerHTML = `<header class="top"><b>Sırada yönetim</b><span class="soft small">${esc(admin.username)}</span><button class="btn light sm" data-act="logout">Çıkış</button></header>
  <div class="ph"><div><span class="lbl">Dükkân hesapları</span><h1>Dükkânlar</h1></div>
    <form class="inline" id="cf" novalidate><label class="fld" for="cn"><span>Kaç dükkân</span><input id="cn" type="number" min="1" max="50" value="10"></label>
      <label class="fld" for="cp"><span>Bağlantı öneki</span><input id="cp" value="berber" autocapitalize="none"></label><button class="btn" type="submit">Hesapları oluştur</button></form></div>
  ${made ? `<div class="creds"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><b style="font-size:1.1rem">${made.length} yeni dükkân hesabı</b>
      <span class="mini"><button class="btn sm" data-act="copyAll">Tümünü kopyala</button><button class="btn sm" data-act="csv">CSV indir</button><button class="btn sm" data-act="hideMade">Kapat</button></span></div>
    <p style="margin:0;font-family:var(--sans);font-size:.9rem">İlk şifre “kullanıcı adı + 123”. Listeyi kopyala ya da indir, sattığın berbere ilet; ilk girişten sonra Hesabım'dan şifresini değiştirmesini söyle.</p>
    <div class="tbl" style="border-color:var(--on-band)"><table><thead><tr><th>Müşteri bağlantısı</th><th>Dükkân kodu</th><th>Kullanıcı adı</th><th>Şifre</th></tr></thead><tbody>
      ${made.map(m => `<tr><td>${esc(origin + "/" + m.slug)}</td><td>${esc(m.slug)}</td><td>${esc(m.username)}</td><td style="user-select:all">${esc(m.password)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
  ${reset ? `<div class="creds"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><b>Yeni şifre · ${esc(reset.slug)}</b><button class="btn sm" data-act="hideReset">Kapat</button></div>
    <div style="font-family:var(--mono)">Dükkân kodu: ${esc(reset.slug)}<br>Kullanıcı adı: ${esc(reset.username)}<br>Şifre: <span style="user-select:all">${esc(reset.password)}</span></div>
    <span class="mini"><button class="btn sm" data-act="copyReset">Kopyala</button></span></div>` : ""}
  ${detail ? detailHtml() : ""}
  <div class="kpis"><div><span class="lbl">Dükkân</span><b>${list.length}</b></div><div><span class="lbl">Kullanımda</span><b>${sold}</b></div><div><span class="lbl">Açık randevu</span><b>${list.reduce((s, x) => s + x.open, 0)}</b></div><div><span class="lbl">Toplam randevu</span><b>${list.reduce((s, x) => s + x.bookings, 0)}</b></div></div>
  ${picked.size ? `<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px var(--bad)"><span><b>${picked.size} dükkân seçildi.</b> ${bulkAsk ? "Hesapları, ustaları ve randevularıyla birlikte kalıcı olarak silinecek." : ""}</span>
    <span class="mini">${bulkAsk ? `<button class="btn light sm" data-act="bulkNo">Vazgeç</button><button class="btn danger sm" data-act="bulkYes">Evet, ${picked.size} dükkânı sil</button>` : `<button class="btn light sm" data-act="pickNone">Seçimi kaldır</button><button class="btn danger sm" data-act="bulkAsk">Seçilenleri sil</button>`}</span></div>` : ""}
  <div class="tbl"><table><thead><tr><th style="width:34px"><input type="checkbox" aria-label="Hepsini seç" data-pickall ${list.length && picked.size === list.length ? "checked" : ""} style="width:18px;height:18px"></th><th>Dükkân</th><th>Bağlantı</th><th>Sahip girişi</th><th class="n">Usta</th><th class="n">Randevu</th><th>Son randevu</th><th>Not</th><th></th></tr></thead><tbody>
    ${list.map(s => `<tr class="${s.disabled ? "off" : ""}"><td><input type="checkbox" aria-label="${esc(s.name)} seç" data-pick="${s.id}" ${picked.has(s.id) ? "checked" : ""} style="width:18px;height:18px"></td><td><b>${esc(s.name)}</b>${s.disabled ? ' <span class="tag iptal">Kapalı</span>' : s.barbers ? "" : ' <span class="tag gelmedi">Usta yok · sayfa kapalı</span>'}<div class="soft small">${day(s.createdAt)}</div></td>
      <td>${editSlug === s.id ? `<form class="inline" data-slug="${s.id}" novalidate><input id="sl-${s.id}" value="${esc(s.slug)}" style="min-width:140px"><button class="btn sm" type="submit">Kaydet</button></form>` : `<a class="link mono" href="/${esc(s.slug)}" target="_blank" rel="noopener">/${esc(s.slug)}</a> <button class="link small soft" data-act="editSlug" data-id="${s.id}">değiştir</button>`}</td>
      <td class="mono small">${esc(s.owner || "—")}</td><td class="n">${s.barbers}</td><td class="n">${s.bookings}${s.open ? ` <span class="soft">(${s.open} açık)</span>` : ""}</td><td>${day(s.last)}</td>
      <td><input aria-label="Not" data-note="${s.id}" value="${esc(s.note)}" placeholder="Örn. Ahmet Bey, Kadıköy" style="min-width:160px;padding:7px 9px;font-size:.88rem"></td>
      <td><div class="mini"><button class="btn sm" data-act="manage" data-id="${s.id}">Yönet</button><button class="btn light sm" data-act="reset" data-id="${s.id}" data-slug="${esc(s.slug)}">Sahip şifresini yenile</button><button class="btn light sm" data-act="toggle" data-id="${s.id}" data-d="${s.disabled ? 0 : 1}">${s.disabled ? "Aç" : "Kapat"}</button>${rowAsk === s.id ? `<button class="btn light sm" data-act="rowNo">Vazgeç</button><button class="btn danger sm" data-act="rowYes" data-id="${s.id}" data-slug="${esc(s.slug)}">Evet, sil</button>` : `<button class="btn danger sm" data-act="rowDel" data-id="${s.id}">Sil</button>`}</div></td></tr>`).join("")
      || `<tr><td colspan="9" class="soft">Henüz dükkân yok. Yukarıdan hesap oluştur.</td></tr>`}</tbody></table></div>
  <div class="det" style="margin-top:28px"><h2 style="font-size:1.4rem">Yöneticiler</h2>
    <p class="soft small" style="margin:0">Buradaki her yönetici bu paneli kullanabilir: dükkân açar, siler, şifre yeniler, dükkân paneline girer.</p>
    ${admins ? admins.admins.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:10px"><span><b class="mono">${esc(x.username)}</b>${x.username === admins.me ? ' <span class="tag mut">Sen</span>' : ""} <span class="soft small">${x.by ? "· " + esc(x.by) + " ekledi" : ""}</span></span>
      ${x.username === admins.me ? "" : adminDel === x.username ? `<span class="mini"><button class="btn light sm" data-act="admNo">Vazgeç</button><button class="btn danger sm" data-act="admYes" data-u="${esc(x.username)}">Evet, sil</button></span>` : `<button class="btn danger sm" data-act="admDel" data-u="${esc(x.username)}">Sil</button>`}</div>`).join("") : `<p class="soft small">Yükleniyor…</p>`}
    <form class="inline" id="admF" novalidate style="border-top:1px solid var(--hair);padding-top:12px"><label class="fld" for="admU"><span>Yeni yönetici · kullanıcı adı</span><input id="admU" autocapitalize="none" placeholder="baran" autocomplete="off"></label>
      <label class="fld" for="admP"><span>Şifre <span class="soft">(en az 10 karakter)</span></span><input id="admP" type="text" autocomplete="off"></label><button class="btn sm" type="submit">Yönetici ekle</button></form>
    <form class="inline" id="mypF" novalidate style="border-top:1px solid var(--hair);padding-top:12px"><label class="fld" for="mpO"><span>Kendi şifren · mevcut</span><input id="mpO" type="password" autocomplete="current-password"></label>
      <label class="fld" for="mpN"><span>Yeni şifre</span><input id="mpN" type="password" autocomplete="new-password"></label><button class="btn light sm" type="submit">Şifremi değiştir</button></form>
  </div>
  <div class="det" style="margin-top:28px;box-shadow:inset 0 0 0 1.5px var(--bad)"><h2 style="font-size:1.4rem">Tüm dükkânları sil</h2>
    <p class="soft small" style="margin:0">Bütün dükkânlar, giriş hesapları, ustalar, randevular ve müşteri kayıtları kalıcı olarak silinir; geri alınamaz. Yönetici hesabın kalır.</p>
    <form class="inline" id="wipeF" novalidate><label class="fld" for="wipeC"><span>Onay için <b>HEPSİNİ SİL</b> yaz</span><input id="wipeC" autocomplete="off"></label><button class="btn danger" type="submit">Tümünü kalıcı olarak sil</button></form></div>
  <p class="soft small">Berber kendi panelinden dükkân adını, saatlerini, hizmetlerini ve ustalarını ayarlar. Kapatılan dükkânın müşteri sayfası ve girişi çalışmaz; veriler silinmez.</p>`;
}
function detailHtml() {
  if (!D) return `<div class="det"><p class="soft" style="margin:0">Yükleniyor…</p></div>`;
  const sh = D.shop;
  return `<div class="det"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start">
      <div><span class="lbl">Dükkân yönetimi · /${esc(sh.slug)}</span><h2>${esc(sh.name)}</h2></div>
      <span class="mini"><button class="btn" data-act="enter" data-id="${sh.id}">Dükkân paneline gir</button><button class="btn light" data-act="closeDetail">Kapat</button></span></div>
    ${sh.barbers ? `<div class="state ok" style="display:flex;gap:10px"><span class="dot"></span><span><b>Müşteri sayfası açık.</b> ${sh.barbers} usta randevu alıyor · <a class="link" href="/${esc(sh.slug)}" target="_blank" rel="noopener">/${esc(sh.slug)}</a></span></div>`
      : `<div class="note" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:inset 0 0 0 1.5px var(--bad)"><span><b>Müşteri sayfası kapalı: hiç usta yok.</b> Bu yüzden bağlantı “Yakında açılıyor” gösteriyor.</span><button class="btn sm" data-act="openChair" data-id="${sh.id}">Hemen aç</button></div>`}
    <p class="soft small" style="margin:0">“Dükkân paneline gir” seni bu dükkânın usta paneline sahip yetkisiyle sokar: ayarlar, ustalar, randevular ve müşteriler dahil her şeyi değiştirebilirsin. Oturum 8 saat sürer.</p>
    <div class="inline"><label class="fld" for="dName"><span>Dükkân adı</span><input id="dName" maxlength="40" value="${esc(sh.name)}"></label><button class="btn light sm" data-act="saveName">Adı kaydet</button>
      <label class="fld" for="dSlug"><span>Bağlantı adı</span><input id="dSlug" maxlength="30" value="${esc(sh.slug)}" autocapitalize="none"></label><button class="btn light sm" data-act="saveSlug">Bağlantıyı kaydet</button></div>
    <div><span class="lbl">Giriş hesapları (${D.users.length})</span>
      ${D.users.map(u => `<div class="urow" data-u="${esc(u.username)}">
        <label class="fld"><span>Kullanıcı adı</span><input value="${esc(u.username)}" data-f="un" autocapitalize="none"></label>
        <label class="fld"><span>Görünen ad</span><input value="${esc(u.name)}" data-f="nm" maxlength="40"></label>
        <span class="mini"><button class="btn sm" data-act="uSave">Kaydet</button><button class="btn light sm" data-act="uPass">Yeni şifre</button>${u.chair ? "" : `<button class="btn y sm" data-act="uChair">Koltuk ver</button>`}<button class="btn light sm" data-act="uToggle" data-d="${u.disabled ? 0 : 1}">${u.disabled ? "Aç" : "Kapat"}</button><button class="btn danger sm" data-act="uDel">Sil</button></span>
        <span class="meta">${u.role === "sahip" ? "Dükkân sahibi" : "Usta"}${u.chair ? " · müşteriler seçebilir (" + esc(u.chair) + ")" : " · <b>koltuğu yok, müşteriler göremez</b>"}${u.disabled ? " · <b style='color:var(--bad)'>giriş kapalı</b>" : ""}</span></div>`).join("")}
    </div>
    <form class="inline" id="uaF" novalidate style="border-top:1px solid var(--hair);padding-top:14px"><label class="fld" for="uaU"><span>Yeni hesap · kullanıcı adı</span><input id="uaU" autocapitalize="none"></label>
      <label class="fld" for="uaN"><span>Ad</span><input id="uaN" maxlength="40"></label>
      <label class="fld" for="uaR"><span>Rol</span><select id="uaR"><option value="sahip">Dükkân sahibi</option><option value="usta">Usta</option></select></label><button class="btn light sm" type="submit">Hesap ekle</button></form>
    <div style="border-top:1px solid var(--hair);padding-top:14px">${delAsk ? `<form class="inline" id="delF" novalidate><label class="fld" for="delC"><span>Silmek için dükkân kodunu yaz: <b>${esc(sh.slug)}</b></span><input id="delC" autocapitalize="none"></label><button class="btn light sm" type="button" data-act="delNo">Vazgeç</button><button class="btn danger sm" type="submit">Dükkânı sil</button></form>`
      : `<button class="btn danger sm" data-act="delAsk">Dükkânı sil</button> <span class="soft small">Bağlantısı ve girişleri çalışmaz hale gelir.</span>`}</div>
  </div>`;
}
async function openDetail(id) { detail = id; D = null; delAsk = false; render(); try { D = await call("shop&id=" + encodeURIComponent(id)); } catch (e) { toast(e.message); detail = null; } render(); window.scrollTo(0, 0); }
const credText = (rows) => rows.map(m => `Bağlantı: ${location.origin}/${m.slug}\nUsta girişi: ${location.origin}/usta\nDükkân kodu: ${m.slug}\nKullanıcı adı: ${m.username}\nŞifre: ${m.password}`).join("\n\n");
async function copy(t) { try { await navigator.clipboard.writeText(t); toast("Kopyalandı"); } catch { prompt("Kopyala:", t); } }
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "logout": await call("logout", {}).catch(() => {}); admin = null; renderAuth(); break;
    case "copyAll": copy(credText(made)); break;
    case "csv": { const csv = "baglanti,dukkan_kodu,kullanici_adi,sifre\n" + made.map(m => [location.origin + "/" + m.slug, m.slug, m.username, m.password].join(",")).join("\n");
      const aEl = document.createElement("a"); aEl.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); aEl.download = "sirada-dukkan-hesaplari.csv"; document.body.appendChild(aEl); aEl.click(); setTimeout(() => aEl.remove(), 300); break; }
    case "hideMade": made = null; render(); break;
    case "hideReset": reset = null; render(); break;
    case "copyReset": copy(credText([reset])); break;
    case "editSlug": editSlug = id; render(); break;
    case "reset": if (el.dataset.sure) { try { const r = await call("resetOwner", { id }); reset = { ...r, slug: el.dataset.slug }; render(); window.scrollTo(0, 0); } catch (x) { toast(x.message); } } else { el.dataset.sure = "1"; el.textContent = "Eski şifre geçersiz olacak · Onayla"; } break;
    case "rowDel": rowAsk = id; render(); break;
    case "rowNo": rowAsk = null; render(); break;
    case "rowYes": try { await call("deleteShop", { id, confirm: el.dataset.slug }); rowAsk = null; picked.delete(id); if (detail === id) { detail = null; D = null; } toast("Dükkân silindi"); await load(); } catch (x) { toast(x.message); } break;
    case "pickNone": picked.clear(); bulkAsk = false; render(); break;
    case "bulkAsk": bulkAsk = true; render(); break;
    case "bulkNo": bulkAsk = false; render(); break;
    case "bulkYes": try { const r = await call("deleteShops", { ids: [...picked], confirm: true }); toast(r.deleted + " dükkân silindi"); if (detail && picked.has(detail)) { detail = null; D = null; } picked.clear(); bulkAsk = false; await load(); } catch (x) { toast(x.message); } break;
    case "openChair": try { await call("openChair", { id }); toast("Müşteri sayfası açıldı"); await load(); openDetail(id); } catch (x) { toast(x.message); } break;
    case "admDel": adminDel = el.dataset.u; render(); break;
    case "admNo": adminDel = null; render(); break;
    case "admYes": try { await call("removeAdmin", { username: el.dataset.u }); adminDel = null; toast("Yönetici silindi"); await load(); } catch (x) { toast(x.message); } break;
    case "manage": openDetail(id); break;
    case "closeDetail": detail = null; D = null; render(); break;
    case "enter": try { const r = await call("enter", { id }); window.open("/usta", "_blank") || (location.href = "/usta"); toast("Dükkân paneli açıldı"); } catch (x) { toast(x.message); } break;
    case "saveName": try { await call("rename", { id: D.shop.id, name: $("dName").value }); toast("Dükkân adı değişti"); await load(); openDetail(D.shop.id); } catch (x) { toast(x.message); } break;
    case "saveSlug": try { await call("slug", { id: D.shop.id, slug: $("dSlug").value }); toast("Bağlantı değişti"); await load(); openDetail(D.shop.id); } catch (x) { toast(x.message); } break;
    case "uSave": { const row = el.closest(".urow"), old = row.dataset.u, un = row.querySelector("[data-f=un]").value.trim(), nm = row.querySelector("[data-f=nm]").value;
      try { const cur = D.users.find(u => u.username === old); if (nm !== cur.name) await call("userName", { id: D.shop.id, username: old, name: nm }); if (un && un !== old) await call("userRename", { id: D.shop.id, username: old, newUsername: un }); toast("Hesap kaydedildi"); await load(); openDetail(D.shop.id); } catch (x) { toast(x.message); } break; }
    case "uPass": { const u = el.closest(".urow").dataset.u; try { const r = await call("userPass", { id: D.shop.id, username: u }); reset = { username: r.username, password: r.password, slug: D.shop.slug }; render(); window.scrollTo(0, 0); } catch (x) { toast(x.message); } break; }
    case "uChair": { const u = el.closest(".urow").dataset.u; try { await call("giveChair", { id: D.shop.id, username: u }); toast("Koltuk verildi; müşteriler artık seçebilir"); await load(); openDetail(D.shop.id); } catch (x) { toast(x.message); } break; }
    case "uToggle": { const u = el.closest(".urow").dataset.u; try { await call("userToggle", { id: D.shop.id, username: u, disabled: el.dataset.d === "1" }); toast("Güncellendi"); openDetail(D.shop.id); } catch (x) { toast(x.message); } break; }
    case "uDel": { if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Emin misin?"; break; } const u = el.closest(".urow").dataset.u; try { await call("userDelete", { id: D.shop.id, username: u }); toast("Hesap silindi"); openDetail(D.shop.id); } catch (x) { toast(x.message); } break; }
    case "delAsk": delAsk = true; render(); break;
    case "delNo": delAsk = false; render(); break;
    case "toggle": try { await call("toggle", { id, disabled: el.dataset.d === "1" }); await load(); toast("Güncellendi"); } catch (x) { toast(x.message); } break;
  }
});
document.addEventListener("submit", async (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === "cf") { try { made = (await call("create", { count: +$("cn").value, prefix: $("cp").value })).made; await load(); window.scrollTo(0, 0); } catch (x) { toast(x.message); } }
  if (f.id === "admF") { try { await call("addAdmin", { username: $("admU").value, password: $("admP").value }); toast("Yönetici eklendi"); await load(); } catch (x) { toast(x.message); } }
  if (f.id === "mypF") { try { await call("adminPass", { old: $("mpO").value, password: $("mpN").value }); toast("Şifren değişti"); render(); } catch (x) { toast(x.message); } }
  if (f.id === "wipeF") { try { const r = await call("deleteAll", { confirm: $("wipeC").value.trim() }); made = null; reset = null; detail = null; D = null; toast(r.deleted + " dükkân silindi"); await load(); } catch (x) { toast(x.message); } }
  if (f.id === "uaF") { try { const r = await call("userAdd", { id: D.shop.id, username: $("uaU").value, name: $("uaN").value, role: $("uaR").value }); reset = { username: r.username, password: r.password, slug: D.shop.slug }; await openDetail(D.shop.id); } catch (x) { toast(x.message); } }
  if (f.id === "delF") { try { await call("deleteShop", { id: D.shop.id, confirm: $("delC").value.trim() }); toast("Dükkân silindi"); detail = null; D = null; await load(); } catch (x) { toast(x.message); } }
  if (f.dataset.slug) { const id = f.dataset.slug; try { await call("slug", { id, slug: $("sl-" + id).value }); editSlug = null; await load(); toast("Bağlantı değişti"); } catch (x) { toast(x.message); } }
});
document.addEventListener("change", async (e) => { const t = e.target;
  if (t.dataset.pick) { t.checked ? picked.add(t.dataset.pick) : picked.delete(t.dataset.pick); bulkAsk = false; render(); return; }
  if (t.hasAttribute("data-pickall")) { picked = t.checked ? new Set((shops || []).map(x => x.id)) : new Set(); bulkAsk = false; render(); return; } if (t.dataset.note) { try { await call("note", { id: t.dataset.note, note: t.value }); toast("Not kaydedildi"); } catch (x) { toast(x.message); } } });
(async () => {
  try { const r = await call("status"); admin = r.admin; needsSetup = r.needsSetup; } catch { $("root").innerHTML = `<div class="auth"><div class="empty"><b>Bağlanılamadı.</b> Sayfayı yenile.</div></div>`; return; }
  admin ? load() : renderAuth();
})();
</script>
</body>
